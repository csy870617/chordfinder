<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Chord Finder Pro</title>
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- 첫 페인트 깜빡임 방지: CSS 적용 전에 저장된 테마를 미리 반영 -->
    <script>
        (function () {
            try {
                var p = localStorage.getItem('theme') || 'auto';
                var dark = p === 'dark' ||
                    (p !== 'light' && window.matchMedia &&
                     window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>CHORD<span class="highlight">FINDER</span><span class="pro-badge">PRO</span></h1>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="테마 전환">🌗</button>
        </header>

        <!-- 악기 선택 탭 -->
        <div class="instrument-tabs">
            <button class="tab-btn active" type="button" data-instrument="guitar" aria-pressed="true">
                <span class="tab-icon">🎸</span> Guitar
            </button>
            <button class="tab-btn" type="button" data-instrument="ukulele" aria-pressed="false">
                <span class="tab-icon">🪕</span> Ukulele
            </button>
        </div>

        <!-- 루트음 선택 (12음계) -->
        <div class="root-selector">
            <div class="root-grid">
                <button class="root-btn active" type="button" data-root="C" aria-pressed="true">C</button>
                <button class="root-btn" type="button" data-root="C#" aria-pressed="false">C#</button>
                <button class="root-btn" type="button" data-root="D" aria-pressed="false">D</button>
                <button class="root-btn" type="button" data-root="D#" aria-pressed="false">D#</button>
                <button class="root-btn" type="button" data-root="E" aria-pressed="false">E</button>
                <button class="root-btn" type="button" data-root="F" aria-pressed="false">F</button>
                <button class="root-btn" type="button" data-root="F#" aria-pressed="false">F#</button>
                <button class="root-btn" type="button" data-root="G" aria-pressed="false">G</button>
                <button class="root-btn" type="button" data-root="G#" aria-pressed="false">G#</button>
                <button class="root-btn" type="button" data-root="A" aria-pressed="false">A</button>
                <button class="root-btn" type="button" data-root="A#" aria-pressed="false">A#</button>
                <button class="root-btn" type="button" data-root="B" aria-pressed="false">B</button>
            </div>
        </div>

        <!-- 코드 타입 선택 -->
        <div class="type-selector">
            <div class="type-grid">
                <button class="type-btn active" type="button" data-type="major" aria-pressed="true">Major</button>
                <button class="type-btn" type="button" data-type="minor" aria-pressed="false">minor</button>
                <button class="type-btn" type="button" data-type="7" aria-pressed="false">7</button>
                <button class="type-btn" type="button" data-type="m7" aria-pressed="false">m7</button>
                <button class="type-btn" type="button" data-type="maj7" aria-pressed="false">Maj7</button>
                <button class="type-btn" type="button" data-type="sus2" aria-pressed="false">sus2</button>
                <button class="type-btn" type="button" data-type="sus4" aria-pressed="false">sus4</button>
                <button class="type-btn" type="button" data-type="dim" aria-pressed="false">dim</button>
                <button class="type-btn" type="button" data-type="aug" aria-pressed="false">aug</button>
                <button class="type-btn" type="button" data-type="add9" aria-pressed="false">add9</button>
                <button class="type-btn" type="button" data-type="6" aria-pressed="false">6</button>
                <button class="type-btn" type="button" data-type="9" aria-pressed="false">9</button>
            </div>
        </div>

        <!-- 옵션 바 -->
        <div class="options-bar">
            <div class="option-item">
                <label class="option-label">카포</label>
                <div class="capo-control">
                    <button class="capo-btn" type="button" id="capo-minus" aria-label="카포 감소">−</button>
                    <span class="capo-value" id="capo-value">0</span>
                    <button class="capo-btn" type="button" id="capo-plus" aria-label="카포 증가">+</button>
                </div>
            </div>
            <div class="option-item">
                <label class="option-label" for="lefty-toggle">왼손잡이</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="lefty-toggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <div class="option-item">
                <label class="option-label" for="note-toggle">음이름</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="note-toggle" checked>
                    <span class="toggle-slider"></span>
                </label>
            </div>
        </div>

        <!-- 프렛보드 -->
        <div class="fretboard-wrapper">
            <div class="fretboard-glass">
                <svg id="fretboard" viewBox="0 0 280 280" role="img" aria-label="코드 프렛보드 다이어그램">
                    <defs>
                        <linearGradient id="nutGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ccc;stop-opacity:1" />
                        </linearGradient>
                        <filter id="dotGlow">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <rect id="nut" x="50" y="30" width="160" height="8" fill="url(#nutGradient)" />
                    <g id="fret-markers"></g>
                    <g id="fret-lines"></g>
                    <g id="strings"></g>
                    <g id="fret-numbers"></g>
                    <g id="finger-positions"></g>
                </svg>
            </div>
            <!-- 포지션 네비게이션 -->
            <div class="position-nav">
                <button class="pos-nav-btn" type="button" id="prev-pos-btn" aria-label="이전 포지션">‹</button>
                <div class="position-indicator">
                    <span id="position-label" aria-live="polite">포지션 1/3</span>
                </div>
                <button class="pos-nav-btn" type="button" id="next-pos-btn" aria-label="다음 포지션">›</button>
            </div>
        </div>
        
        <!-- 코드 정보 -->
        <div class="info-area">
            <div class="chord-info-card">
                <p id="chord-name-display">C Major</p>
                <p id="chord-notes" class="chord-notes">C - E - G</p>
            </div>
            
            <button id="play-btn" class="play-button" type="button" aria-label="코드 스트럼 재생">
                <span class="play-icon" aria-hidden="true">▶</span>
                <span>스트럼 재생</span>
            </button>
        </div>

        <!-- 관련 코드 추천 -->
        <div class="related-chords">
            <h3>🎵 관련 코드</h3>
            <div class="related-grid" id="related-chords-grid"></div>
        </div>
    </div>

    <script src="chords.js"></script>
    <script src="script.js"></script>
</body>
</html>
